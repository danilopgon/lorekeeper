name: Work item
description: Track approved Lorekeeper implementation, documentation, maintenance, or bug work.
title: "[Work]: "
labels: []
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What should change?
      placeholder: Describe the intended outcome in one or two paragraphs.
    validations:
      required: true
  - type: dropdown
    id: work-type
    attributes:
      label: Work type
      description: Select the primary work type. PRs should use the matching `type:*` label.
      options:
        - Feature
        - Bug fix
        - Documentation
        - Refactor
        - Maintenance/tooling
        - Breaking change
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is included?
      placeholder: List the concrete boundaries, files, screens, contracts, or behavior in scope.
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals
      description: What should not be included?
      placeholder: List exclusions that prevent plausible scope creep.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will we know this is done?
      placeholder: Use bullets or scenarios. Include tests or verification when known.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Link specifications, SDD/OpenSpec changes, designs, or relevant context.
      placeholder: Add links or paths.
    validations:
      required: false
