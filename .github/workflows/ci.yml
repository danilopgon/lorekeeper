name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  commitlint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v6
        with:
          node-version: "24.21.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec commitlint --from=${{ github.event.pull_request.base.sha }} --to=${{ github.event.pull_request.head.sha }} --verbose

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: lorekeeper
          POSTGRES_PASSWORD: lorekeeper_test_password
          POSTGRES_USER: lorekeeper
        options: >-
          --health-cmd "pg_isready -U lorekeeper -d lorekeeper"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v6
        with:
          node-version: "24.21.0"
          cache: pnpm
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run build
      - run: pnpm run tools:restore
      - run: pnpm run api:migrate
        env:
          ConnectionStrings__Campaigns: Host=127.0.0.1;Port=${{ job.services.postgres.ports[5432] }};Database=lorekeeper;Username=lorekeeper;Password=lorekeeper_test_password
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm run e2e
        env:
          ConnectionStrings__Campaigns: Host=127.0.0.1;Port=${{ job.services.postgres.ports[5432] }};Database=lorekeeper;Username=lorekeeper;Password=lorekeeper_test_password

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore services/api/Lorekeeper.slnx
      - run: dotnet format services/api/Lorekeeper.slnx --verify-no-changes
      - run: dotnet build services/api/Lorekeeper.slnx --no-restore --configuration Release
      - run: dotnet test services/api/Lorekeeper.slnx --no-build --configuration Release
