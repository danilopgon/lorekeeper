services:
  postgres:
    image: postgres:17
    container_name: lorekeeper-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lorekeeper}
      POSTGRES_USER: ${POSTGRES_USER:-lorekeeper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lorekeeper_dev_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-lorekeeper} -d ${POSTGRES_DB:-lorekeeper}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
